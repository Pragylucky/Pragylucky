<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="172" viewBox="0 0 1000 172"><defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f7ff"/><stop offset="0.5" stop-color="#c9a0ff"/><stop offset="1" stop-color="#00f7ff"/><animate attributeName="x1" values="-1;0" dur="4s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1" dur="4s" repeatCount="indefinite"/></linearGradient><linearGradient id="cv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f7ff"/><stop offset="1" stop-color="#b57bff"/></linearGradient></defs><rect x="6" y="6" width="321" height="160" rx="16" fill="#130c2e" stroke="#b57bff" stroke-opacity="0.35"><animate attributeName="stroke-opacity" values="0.25;0.9;0.25" dur="4s" begin="0.00s" repeatCount="indefinite"/></rect><circle cx="32" cy="41" r="4" fill="#00f7ff"><animate attributeName="r" values="3;5;3" dur="2s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.0s" repeatCount="indefinite"/></circle><text x="48" y="46" font-size="13" font-weight="700" fill="#00f7ff" text-anchor="start" letter-spacing="3" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif">THE PROBLEM</text><text x="28" y="84" font-size="15" font-weight="400" fill="#ece7ff" text-anchor="start" letter-spacing="0" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif">Lost-pet alerts get buried in</text><text x="28" y="108" font-size="15" font-weight="400" fill="#ece7ff" text-anchor="start" letter-spacing="0" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif">fifty WhatsApp groups. Adoption</text><text x="28" y="132" font-size="15" font-weight="400" fill="#ece7ff" text-anchor="start" letter-spacing="0" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif">DMs end in 'transport fee' scams.</text><rect x="339" y="6" width="321" height="160" rx="16" fill="#130c2e" stroke="#b57bff" stroke-opacity="0.35"><animate attributeName="stroke-opacity" values="0.25;0.9;0.25" dur="4s" begin="0.70s" repeatCount="indefinite"/></rect><circle cx="365" cy="41" r="4" fill="#b57bff"><animate attributeName="r" values="3;5;3" dur="2s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle><text x="381" y="46" font-size="13" font-weight="700" fill="#b57bff" text-anchor="start" letter-spacing="3" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif">WHO IT'S FOR</text><text x="361" y="84" font-size="15" font-weight="400" fill="#ece7ff" text-anchor="start" letter-spacing="0" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif">Dog and cat families, adopters</text><text x="361" y="108" font-size="15" font-weight="400" fill="#ece7ff" text-anchor="start" letter-spacing="0" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif">and NGOs across Delhi NCR who</text><text x="361" y="132" font-size="15" font-weight="400" fill="#ece7ff" text-anchor="start" letter-spacing="0" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif">need one place they can trust.</text><rect x="672" y="6" width="321" height="160" rx="16" fill="#130c2e" stroke="#b57bff" stroke-opacity="0.35"><animate attributeName="stroke-opacity" values="0.25;0.9;0.25" dur="4s" begin="1.40s" repeatCount="indefinite"/></rect><circle cx="698" cy="41" r="4" fill="#00f7ff"><animate attributeName="r" values="3;5;3" dur="2s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle><text x="714" y="46" font-size="13" font-weight="700" fill="#00f7ff" text-anchor="start" letter-spacing="3" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif">THE INSIGHT</text><text x="694" y="84" font-size="15" font-weight="400" fill="#ece7ff" text-anchor="start" letter-spacing="0" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif">People won't leave WhatsApp.</text><text x="694" y="108" font-size="15" font-weight="400" fill="#ece7ff" text-anchor="start" letter-spacing="0" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif">So PupMeow doesn't replace chat.</text><text x="694" y="132" font-size="15" font-weight="400" fill="#ece7ff" text-anchor="start" letter-spacing="0" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif">It hands the conversation back.</text></svg>